---
layout: default
---
<script>
  const path = window.location.pathname;

  const isMobile = window.innerWidth <= 768;

  if (path('{{ "/mobile" | relative_url }}') && !isMobile) {
    location.reload(); // atau ganti ke "/desktop/"
  }

  if (path('{{ "/desktop" | relative_url }}') && isMobile) {
    location.reload(); // atau ganti ke "/mobile/"
  }

  if (!localStorage.getItem('uiRedirected')) {
    localStorage.setItem('uiRedirected', 'true');

    if (isMobile) {
      window.location.href = "{{ '/mobile' | relative_url }}";
    } else {
      window.location.href = "{{ '/desktop' | relative_url }}";
    }
  }
</script>
