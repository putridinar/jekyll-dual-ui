---
layout: default
---
<script>
  (function() {
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const path = window.location.pathname;
    const mobilePath = '{{ "/mobile" | relative_url }}';
    const desktopPath = '{{ "/desktop" | relative_url }}';

    if (path.includes(mobilePath) && !isMobile) {
      window.location.href = desktopPath;
      return;
    }
    if (path.includes(desktopPath) && isMobile) {
      window.location.href = mobilePath;
      return;
    }
    if (!path.includes(mobilePath) && !path.includes(desktopPath)) {
      if (!localStorage.getItem('uiRedirected')) {
        localStorage.setItem('uiRedirected', 'true');
        window.location.href = isMobile ? mobilePath : desktopPath;
      }
    }
  })();
</script>
